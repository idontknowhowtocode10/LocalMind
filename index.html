<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LocalMind — On-Device AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #1a1a24;
    --border: #2a2a3a;
    --accent: #7c3aed;
    --accent2: #06b6d4;
    --accent-glow: rgba(124,58,237,0.25);
    --text: #e8e8f0;
    --text-dim: #6b6b8a;
    --user-bubble: #1e1030;
    --ai-bubble: #111820;
    --danger: #ef4444;
    --success: #22c55e;
    --mono: 'Space Mono', monospace;
    --sans: 'Syne', sans-serif;
    --sidebar-w: 280px;
    --header-h: 72px;
    --transition: 0.22s cubic-bezier(0.4,0,0.2,1);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--sans); }

  /* === SIDEBAR === */
  #sidebar {
    position: fixed; left: 0; top: 0; height: 100%; width: var(--sidebar-w);
    background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; z-index: 100;
    transform: translateX(-100%); transition: transform var(--transition);
  }
  #sidebar.open { transform: translateX(0); }
  .sidebar-header {
    padding: 20px 16px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .logo { font-family: var(--sans); font-weight: 800; font-size: 1.1rem; letter-spacing: -0.02em; }
  .logo span { color: var(--accent); }
  #btn-new-chat {
    margin: 12px; padding: 10px 14px; background: var(--accent);
    color: #fff; border: none; border-radius: 8px; cursor: pointer;
    font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.05em;
    text-transform: uppercase; transition: background var(--transition), box-shadow var(--transition);
    display: flex; align-items: center; gap: 8px;
  }
  #btn-new-chat:hover { background: #6d28d9; box-shadow: 0 0 20px var(--accent-glow); }
  #chat-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
  #chat-list::-webkit-scrollbar { width: 4px; }
  #chat-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .chat-item {
    display: flex; align-items: center; gap: 8px; padding: 10px 10px;
    border-radius: 8px; cursor: pointer; margin-bottom: 2px;
    transition: background var(--transition); border: 1px solid transparent;
    font-size: 0.82rem; color: var(--text-dim);
  }
  .chat-item:hover { background: var(--surface2); color: var(--text); }
  .chat-item.active { background: var(--surface2); border-color: var(--border); color: var(--text); }
  .chat-item-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 0.72rem; }
  .chat-del { opacity: 0; padding: 2px 5px; background: none; border: none; color: var(--danger); cursor: pointer; font-size: 0.9rem; border-radius: 4px; transition: opacity var(--transition), background var(--transition); }
  .chat-item:hover .chat-del { opacity: 1; }
  .chat-del:hover { background: rgba(239,68,68,0.15); }
  .sidebar-footer { padding: 12px 16px; border-top: 1px solid var(--border); font-family: var(--mono); font-size: 0.65rem; color: var(--text-dim); }

  /* === OVERLAY === */
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 99; display: none; backdrop-filter: blur(2px); }
  #overlay.show { display: block; }

  /* === MAIN === */
  #main { height: 100%; display: flex; flex-direction: column; transition: margin-left var(--transition); }
  @media(min-width: 900px) {
    #sidebar { transform: translateX(0); }
    #main { margin-left: var(--sidebar-w); }
    #btn-sidebar-toggle { display: none !important; }
    #overlay { display: none !important; }
  }

  /* === HEADER === */
  #header {
    height: var(--header-h); padding: 0 16px; border-bottom: 1px solid var(--border);
    background: var(--surface); display: flex; align-items: center; gap: 12px; flex-shrink: 0;
    position: relative; z-index: 10;
  }
  #btn-sidebar-toggle {
    background: none; border: 1px solid var(--border); color: var(--text); padding: 7px 9px;
    border-radius: 7px; cursor: pointer; font-size: 1rem; display: flex; align-items: center;
    transition: background var(--transition);
  }
  #btn-sidebar-toggle:hover { background: var(--surface2); }
  #model-select-wrap { flex: 1; min-width: 0; }
  #model-select {
    width: 100%; padding: 8px 12px; background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; font-family: var(--mono); font-size: 0.72rem;
    cursor: pointer; appearance: none; outline: none; transition: border-color var(--transition);
  }
  #model-select:focus { border-color: var(--accent); }
  #model-select option { background: var(--surface2); }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); flex-shrink: 0; transition: background 0.3s; }
  .status-dot.ready { background: var(--success); box-shadow: 0 0 8px var(--success); }
  .status-dot.loading { background: var(--accent2); animation: pulse 1s infinite; }
  .status-dot.error { background: var(--danger); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  /* === PROGRESS === */
  #progress-wrap { position: absolute; bottom: 0; left: 0; right: 0; height: 2px; overflow: hidden; }
  #progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width 0.3s; }

  /* === BODY === */
  #body { flex: 1; overflow: hidden; display: flex; flex-direction: column; }

  /* === THINKING LOG === */
  #log-wrap { border-bottom: 1px solid var(--border); background: var(--bg); flex-shrink: 0; overflow: hidden; max-height: 0; transition: max-height var(--transition); }
  #log-wrap.expanded { max-height: 130px; }
  #log-toggle { display: flex; align-items: center; gap: 6px; padding: 5px 14px; font-family: var(--mono); font-size: 0.65rem; color: var(--text-dim); cursor: pointer; user-select: none; background: none; border: none; width: 100%; border-bottom: 1px solid var(--border); }
  #log-toggle:hover { color: var(--text); }
  #log-toggle .chevron { transition: transform var(--transition); font-size: 0.55rem; }
  #log-toggle.open .chevron { transform: rotate(180deg); }
  #log { height: 105px; overflow-y: auto; padding: 8px 14px; display: flex; flex-direction: column; gap: 1px; }
  #log::-webkit-scrollbar { width: 3px; }
  #log::-webkit-scrollbar-thumb { background: var(--border); }
  .log-line { font-family: var(--mono); font-size: 0.62rem; color: var(--text-dim); line-height: 1.5; }
  .log-line.info { color: var(--accent2); }
  .log-line.success { color: var(--success); }
  .log-line.warn { color: #f59e0b; }
  .log-line.error { color: var(--danger); }

  /* === MESSAGES === */
  #messages { flex: 1; overflow-y: auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 16px; }
  #messages::-webkit-scrollbar { width: 5px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .msg { display: flex; gap: 10px; max-width: 820px; animation: fadeUp 0.2s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user { flex-direction: row-reverse; align-self: flex-end; }
  .msg.assistant { align-self: flex-start; }
  .avatar { width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; }
  .msg.user .avatar { background: var(--accent); color: #fff; }
  .msg.assistant .avatar { background: var(--surface2); border: 1px solid var(--border); color: var(--accent2); font-family: var(--mono); }
  .bubble {
    padding: 12px 16px; border-radius: 12px; font-size: 0.88rem; line-height: 1.65;
    max-width: min(480px, 72vw); word-break: break-word; white-space: pre-wrap;
  }
  .msg.user .bubble { background: var(--user-bubble); border: 1px solid rgba(124,58,237,0.3); border-top-right-radius: 3px; }
  .msg.assistant .bubble { background: var(--ai-bubble); border: 1px solid var(--border); border-top-left-radius: 3px; }
  .bubble code { font-family: var(--mono); font-size: 0.78rem; background: rgba(255,255,255,0.07); padding: 2px 5px; border-radius: 4px; }
  .cursor { display: inline-block; width: 2px; height: 1em; background: var(--accent2); margin-left: 2px; animation: blink 0.7s infinite; vertical-align: middle; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
  #empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--text-dim); }
  #empty-state h2 { font-family: var(--sans); font-weight: 800; font-size: 1.8rem; color: var(--text); letter-spacing: -0.03em; }
  #empty-state p { font-family: var(--mono); font-size: 0.72rem; text-align: center; max-width: 300px; }
  #empty-state .hint-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 10px; }
  .chip { padding: 7px 13px; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; font-family: var(--mono); font-size: 0.68rem; cursor: pointer; transition: border-color var(--transition), background var(--transition); }
  .chip:hover { border-color: var(--accent); background: rgba(124,58,237,0.1); }

  /* === INPUT === */
  #input-area { padding: 14px 16px; border-top: 1px solid var(--border); background: var(--surface); flex-shrink: 0; }
  #input-row { display: flex; gap: 10px; align-items: flex-end; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; transition: border-color var(--transition); }
  #input-row:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  #user-input {
    flex: 1; background: none; border: none; outline: none; resize: none; overflow: hidden;
    color: var(--text); font-family: var(--sans); font-size: 0.9rem; line-height: 1.5;
    min-height: 24px; max-height: 160px; overflow-y: auto;
  }
  #user-input::placeholder { color: var(--text-dim); }
  #user-input::-webkit-scrollbar { width: 3px; }
  #user-input::-webkit-scrollbar-thumb { background: var(--border); }
  #btn-send {
    width: 36px; height: 36px; background: var(--accent); border: none; border-radius: 8px;
    cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: background var(--transition), box-shadow var(--transition); color: #fff; font-size: 1rem;
  }
  #btn-send:hover:not(:disabled) { background: #6d28d9; box-shadow: 0 0 16px var(--accent-glow); }
  #btn-send:disabled { background: var(--surface); color: var(--text-dim); cursor: not-allowed; }
  #input-hint { font-family: var(--mono); font-size: 0.6rem; color: var(--text-dim); margin-top: 6px; text-align: right; }

  /* === SCROLLBAR global === */
  * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
</style>
</head>
<body>

<!-- Sidebar -->
<div id="sidebar">
  <div class="sidebar-header">
    <div class="logo">Local<span>Mind</span></div>
  </div>
  <button id="btn-new-chat">＋ New Chat</button>
  <div id="chat-list"></div>
  <div class="sidebar-footer">All inference runs in your browser · No data leaves your device</div>
</div>
<div id="overlay"></div>

<!-- Main -->
<div id="main">
  <div id="header">
    <button id="btn-sidebar-toggle" style="display:flex">☰</button>
    <div id="model-select-wrap">
      <select id="model-select">
        <option value="onnx-community/SmolLM2-135M-Instruct-ONNX">SmolLM2 135M — Fastest / Ultra-light</option>
        <option value="onnx-community/SmolLM2-360M-Instruct-ONNX">SmolLM2 360M — Balanced / Light</option>
        <option value="onnx-community/Qwen2.5-0.5B-Instruct-ONNX" selected>Qwen 2.5 0.5B — Smart / Medium</option>
        <option value="onnx-community/Llama-3.2-1B-Instruct-q4f16">Llama 3.2 1B — Heavy / Most Capable</option>
      </select>
    </div>
    <div class="status-dot" id="status-dot"></div>
    <div id="progress-wrap"><div id="progress-bar"></div></div>
  </div>

  <div id="body">
    <!-- Log toggle button -->
    <button id="log-toggle"><span>⚙ ENGINE LOG</span><span class="chevron">▲</span></button>
    <div id="log-wrap"><div id="log"></div></div>

    <div id="messages">
      <div id="empty-state">
        <div style="font-size:2.5rem">🧠</div>
        <h2>LocalMind</h2>
        <p>On-device AI — fully private, zero cloud, powered by WebGPU + WASM</p>
        <div class="hint-chips">
          <div class="chip" data-prompt="Explain how neural networks learn">How do neural nets learn?</div>
          <div class="chip" data-prompt="Write a haiku about the ocean">Write a haiku</div>
          <div class="chip" data-prompt="What is the difference between RAM and storage?">RAM vs Storage</div>
          <div class="chip" data-prompt="Give me 3 tips for better sleep">Sleep tips</div>
        </div>
      </div>
    </div>

    <div id="input-area">
      <div id="input-row">
        <textarea id="user-input" rows="1" placeholder="Send a message…"></textarea>
        <button id="btn-send" disabled>▶</button>
      </div>
      <div id="input-hint">Enter to send · Shift+Enter for new line</div>
    </div>
  </div>
</div>

<script type="module">
import { pipeline, env, TextStreamer } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3';

const localforage = (await import('https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.esm.min.js').catch(() => null))
  ?? await new Promise(res => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js';
    s.onload = () => res(window.localforage);
    document.head.appendChild(s);
  });

env.allowLocalModels = false;

// ── DOM refs ──────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const sidebar   = $('sidebar');
const overlay   = $('overlay');
const btnToggle = $('btn-sidebar-toggle');
const btnNew    = $('btn-new-chat');
const chatList  = $('chat-list');
const modelSel  = $('model-select');
const statusDot = $('status-dot');
const progBar   = $('progress-bar');
const logWrap   = $('log-wrap');
const logEl     = $('log');
const logToggle = $('log-toggle');
const messages  = $('messages');
const emptyState= $('empty-state');
const userInput = $('user-input');
const btnSend   = $('btn-send');

// ── State ─────────────────────────────────────────────────────────────────────
let pipe = null;
let generating = false;
let chats = {};        // { id: { id, title, messages[] } }
let activeChatId = null;
const CHATS_KEY = 'localmind_chats';

// ── Sidebar toggle (mobile) ───────────────────────────────────────────────────
btnToggle.onclick = () => { sidebar.classList.toggle('open'); overlay.classList.toggle('show'); };
overlay.onclick   = () => { sidebar.classList.remove('open'); overlay.classList.remove('show'); };

// ── Log ───────────────────────────────────────────────────────────────────────
logToggle.onclick = () => {
  const open = logWrap.classList.toggle('expanded');
  logToggle.classList.toggle('open', open);
};
function addLog(msg, type = '') {
  const d = document.createElement('div');
  d.className = 'log-line' + (type ? ' ' + type : '');
  d.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
  // auto-expand on interesting events
  if (type === 'warn' || type === 'error') { logWrap.classList.add('expanded'); logToggle.classList.add('open'); }
}

// ── Progress callback ─────────────────────────────────────────────────────────
function onProgress(e) {
  if (e.status === 'progress') {
    const pct = Math.round((e.loaded / e.total) * 100);
    progBar.style.width = pct + '%';
    addLog(`↓ ${e.file} — ${pct}%`);
  } else if (e.status === 'done') {
    addLog(`✓ ${e.file || 'chunk'} loaded`, 'success');
  } else if (e.status === 'initiate') {
    addLog(`⬇ Fetching ${e.file}…`, 'info');
  } else if (e.status === 'ready') {
    addLog('Pipeline ready', 'success');
  }
}

// ── Model loader ──────────────────────────────────────────────────────────────
async function loadModel(modelId) {
  setStatus('loading');
  btnSend.disabled = true;
  progBar.style.width = '0%';
  addLog(`Loading model: ${modelId}`, 'info');

  if (pipe) {
    try { await pipe.dispose?.(); } catch(_) {}
    pipe = null; tokenizer = null;
    addLog('Previous pipeline disposed');
  }

  try {
    pipe = await pipeline('text-generation', modelId, {
      device: 'webgpu',
      dtype: 'q4',
      progress_callback: onProgress,
    });
    progBar.style.width = '100%';
    setTimeout(() => progBar.style.width = '0%', 800);
    setStatus('ready');
    addLog(`Model ready: ${modelId}`, 'success');
    if (!generating) btnSend.disabled = false;
  } catch (err) {
    addLog(`WebGPU failed (${err.message}), retrying WASM…`, 'warn');
    try {
      pipe = await pipeline('text-generation', modelId, {
        device: 'wasm',
        progress_callback: onProgress,
      });
      progBar.style.width = '100%';
      setTimeout(() => progBar.style.width = '0%', 800);
      setStatus('ready');
      addLog(`Model ready (WASM): ${modelId}`, 'success');
      if (!generating) btnSend.disabled = false;
    } catch (err2) {
      setStatus('error');
      addLog(`Failed to load model: ${err2.message}`, 'error');
    }
  }
}

function setStatus(s) {
  statusDot.className = 'status-dot' + (s ? ' ' + s : '');
}

modelSel.onchange = () => loadModel(modelSel.value);

// ── Storage ───────────────────────────────────────────────────────────────────
async function saveChats() { await localforage.setItem(CHATS_KEY, chats); }
async function loadChats() {
  const saved = await localforage.getItem(CHATS_KEY);
  if (saved) chats = saved;
  renderChatList();
}

// ── Chat management ───────────────────────────────────────────────────────────
function newChat() {
  const id = 'chat_' + Date.now();
  chats[id] = { id, title: 'New Chat', messages: [] };
  activeChatId = id;
  saveChats();
  renderChatList();
  renderMessages();
  sidebar.classList.remove('open'); overlay.classList.remove('show');
}

function deleteChat(id) {
  delete chats[id];
  if (activeChatId === id) {
    const ids = Object.keys(chats);
    activeChatId = ids.length ? ids[ids.length - 1] : null;
  }
  saveChats();
  renderChatList();
  renderMessages();
}

function switchChat(id) {
  activeChatId = id;
  renderChatList();
  renderMessages();
  sidebar.classList.remove('open'); overlay.classList.remove('show');
}

function renderChatList() {
  chatList.innerHTML = '';
  const ids = Object.keys(chats).reverse();
  ids.forEach(id => {
    const chat = chats[id];
    const item = document.createElement('div');
    item.className = 'chat-item' + (id === activeChatId ? ' active' : '');
    item.innerHTML = `<span class="chat-item-title">💬 ${escHtml(chat.title)}</span><button class="chat-del" title="Delete">✕</button>`;
    item.onclick = e => { if (!e.target.classList.contains('chat-del')) switchChat(id); };
    item.querySelector('.chat-del').onclick = e => { e.stopPropagation(); deleteChat(id); };
    chatList.appendChild(item);
  });
}

function renderMessages() {
  messages.innerHTML = '';
  const chat = activeChatId && chats[activeChatId];
  if (!chat || chat.messages.length === 0) {
    messages.appendChild(emptyState);
    return;
  }
  chat.messages.forEach(m => appendBubble(m.role, m.content, false));
  messages.scrollTop = messages.scrollHeight;
}

function appendBubble(role, content, streaming = false) {
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;
  const av = document.createElement('div');
  av.className = 'avatar';
  av.textContent = role === 'user' ? 'U' : 'AI';
  const bub = document.createElement('div');
  bub.className = 'bubble';
  bub.textContent = content;
  if (streaming) {
    const cur = document.createElement('span');
    cur.className = 'cursor';
    bub.appendChild(cur);
  }
  wrap.appendChild(av);
  wrap.appendChild(bub);
  messages.appendChild(wrap);
  messages.scrollTop = messages.scrollHeight;
  return bub;
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Generation ────────────────────────────────────────────────────────────────
async function generate(prompt) {
  if (!pipe || generating) return;
  const chat = chats[activeChatId];
  if (!chat) return;

  generating = true;
  btnSend.disabled = true;
  emptyState.remove();

  chat.messages.push({ role: 'user', content: prompt });
  if (chat.title === 'New Chat') chat.title = prompt.slice(0, 36) + (prompt.length > 36 ? '…' : '');
  appendBubble('user', prompt);
  renderChatList();

  const aiBub = appendBubble('assistant', '', true);
  let outputText = '';
  let tokenCount = 0;
  const t0 = performance.now();

  addLog('Generation started…', 'info');

  try {
    const streamer = new TextStreamer(pipe.tokenizer, {
      skip_prompt: true,
      skip_special_tokens: true,
      callback_function: (text) => {
        tokenCount++;
        outputText += text;
        aiBub.childNodes.forEach(n => { if (n.className === 'cursor') n.remove(); });
        aiBub.textContent = outputText;
        const cur = document.createElement('span');
        cur.className = 'cursor';
        aiBub.appendChild(cur);
        messages.scrollTop = messages.scrollHeight;
      }
    });
    const result = await pipe(chat.messages, {
      max_new_tokens: 512,
      do_sample: true,
      temperature: 0.7,
      top_p: 0.9,
      repetition_penalty: 1.1,
      streamer,
    });
    if (!outputText) {
      const raw = result?.[0]?.generated_text;
      if (Array.isArray(raw)) outputText = raw.at(-1)?.content ?? '';
      else if (typeof raw === 'string') {
        const parts = raw.split(/\<\|assistant\|\>|assistant\n/i);
        outputText = (parts.length > 1 ? parts.pop() : raw).trim();
      }
    }
  } catch (err) {
    addLog(`Generation error: ${err.message}`, 'error');
    outputText = outputText || '[Error during generation]';
  }

  aiBub.childNodes.forEach(n => { if (n.className === 'cursor') n.remove(); });
  aiBub.textContent = outputText.trim();

  const elapsed = (performance.now() - t0) / 1000;
  const tps = (tokenCount / elapsed).toFixed(1);
  addLog(`✓ Done — ${tokenCount} tokens · ${tps} tok/s · ${elapsed.toFixed(2)}s`, 'success');

  chat.messages.push({ role: 'assistant', content: outputText.trim() });
  await saveChats();

  generating = false;
  if (pipe) btnSend.disabled = false;
  messages.scrollTop = messages.scrollHeight;
}

// ── Input handling ────────────────────────────────────────────────────────────
userInput.addEventListener('input', () => {
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 160) + 'px';
});

userInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
});

btnSend.onclick = handleSend;

function handleSend() {
  const text = userInput.value.trim();
  if (!text || !pipe || generating) return;
  if (!activeChatId) newChat();
  userInput.value = '';
  userInput.style.height = 'auto';
  generate(text);
}

// Hint chips
document.querySelectorAll('.chip').forEach(c => {
  c.onclick = () => {
    if (!activeChatId) newChat();
    userInput.value = c.dataset.prompt;
    handleSend();
  };
});

btnNew.onclick = newChat;

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  await loadChats();
  const ids = Object.keys(chats);
  if (ids.length) {
    activeChatId = ids[ids.length - 1];
    renderChatList();
    renderMessages();
  } else {
    newChat();
  }
  addLog('LocalMind initialized. Loading model…', 'info');
  await loadModel(modelSel.value);
}

init();
</script>
</body>
</html>
