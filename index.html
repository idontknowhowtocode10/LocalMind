<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>LocalMind — On-Device AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #1a1a24;
    --border: #2a2a3a;
    --accent: #7c3aed;
    --accent2: #06b6d4;
    --accent-glow: rgba(124,58,237,0.25);
    --text: #e8e8f0;
    --text-dim: #6b6b8a;
    --user-bubble: #1e1030;
    --ai-bubble: #111820;
    --danger: #ef4444;
    --success: #22c55e;
    --warn: #f59e0b;
    --mono: 'Space Mono', monospace;
    --sans: 'Syne', sans-serif;
    --sidebar-w: 280px;
    --header-h: 60px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
    --transition: 0.22s cubic-bezier(0.4,0,0.2,1);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { height: 100%; }
  body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    padding-top: var(--safe-top);
    /* Android: prevent rubber-band / overscroll */
    overscroll-behavior: none;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
    user-select: none;
    -webkit-user-select: none;
  }
  /* Allow text selection only inside bubbles */
  .bubble { user-select: text; -webkit-user-select: text; }

  /* === SIDEBAR === */
  #sidebar {
    position: fixed; left: 0; top: 0; height: 100%; width: var(--sidebar-w);
    background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; z-index: 200;
    transform: translateX(-100%); transition: transform var(--transition);
    padding-top: var(--safe-top);
  }
  #sidebar.open { transform: translateX(0); }
  .sidebar-header { padding: 20px 16px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .logo { font-family: var(--sans); font-weight: 800; font-size: 1.1rem; letter-spacing: -0.02em; }
  .logo span { color: var(--accent); }
  #btn-new-chat {
    margin: 12px; padding: 10px 14px; background: var(--accent);
    color: #fff; border: none; border-radius: 8px; cursor: pointer;
    font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.05em;
    text-transform: uppercase; transition: background var(--transition);
    display: flex; align-items: center; gap: 8px;
  }
  #btn-new-chat:active { background: #6d28d9; }
  #chat-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
  #chat-list::-webkit-scrollbar { width: 4px; }
  #chat-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .chat-item {
    display: flex; align-items: center; gap: 8px; padding: 10px 10px;
    border-radius: 8px; cursor: pointer; margin-bottom: 2px;
    transition: background var(--transition); border: 1px solid transparent;
    font-size: 0.82rem; color: var(--text-dim);
  }
  .chat-item:active, .chat-item.active { background: var(--surface2); border-color: var(--border); color: var(--text); }
  .chat-item-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 0.72rem; }
  .chat-del { padding: 4px 8px; background: none; border: none; color: var(--danger); cursor: pointer; font-size: 1rem; border-radius: 4px; }
  .chat-del:active { background: rgba(239,68,68,0.15); }
  .sidebar-footer {
    padding: 12px 16px; border-top: 1px solid var(--border);
    font-family: var(--mono); font-size: 0.62rem; color: var(--text-dim);
    padding-bottom: calc(12px + var(--safe-bottom));
    display: flex; flex-direction: column; gap: 6px;
  }
  .sidebar-actions { display: flex; gap: 6px; margin-bottom: 4px; }
  .sidebar-btn {
    flex: 1; padding: 7px 6px; background: var(--surface2); border: 1px solid var(--border);
    color: var(--text-dim); border-radius: 7px; cursor: pointer;
    font-family: var(--mono); font-size: 0.62rem; text-align: center;
    transition: background var(--transition), color var(--transition);
  }
  .sidebar-btn:active { background: var(--border); color: var(--text); }

  /* === OVERLAY === */
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 199; display: none; backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
  #overlay.show { display: block; }

  /* === CONFIRM MODAL (replaces window.confirm — crashes WebView) === */
  #modal {
    position: fixed; inset: 0; z-index: 300; display: flex;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.65); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    opacity: 0; pointer-events: none; transition: opacity 0.18s;
  }
  #modal.show { opacity: 1; pointer-events: all; }
  .modal-box {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px 22px; max-width: 300px; width: 88%;
  }
  .modal-title { font-weight: 800; font-size: 0.95rem; margin-bottom: 8px; }
  .modal-msg { font-family: var(--mono); font-size: 0.75rem; color: var(--text-dim); line-height: 1.55; margin-bottom: 18px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .modal-btn {
    padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border);
    cursor: pointer; font-family: var(--mono); font-size: 0.72rem; font-weight: 700;
    transition: background var(--transition);
  }
  .modal-btn.cancel { background: var(--surface); color: var(--text-dim); }
  .modal-btn.cancel:active { background: var(--border); }
  .modal-btn.ok { background: var(--accent); color: #fff; border-color: var(--accent); }
  .modal-btn.ok:active { background: #6d28d9; }
  .modal-btn.danger { background: var(--danger); color: #fff; border-color: var(--danger); }
  .modal-btn.danger:active { background: #dc2626; }

  /* === SETTINGS PANEL === */
  #settings-panel {
    position: fixed; inset: 0; z-index: 250; display: flex;
    align-items: flex-end; justify-content: center;
    background: rgba(0,0,0,0.55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  #settings-panel.show { opacity: 1; pointer-events: all; }
  .settings-sheet {
    background: var(--surface); border-top: 1px solid var(--border);
    border-radius: 18px 18px 0 0; padding: 20px 18px;
    padding-bottom: calc(20px + var(--safe-bottom));
    width: 100%; max-width: 600px;
    transform: translateY(100%); transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
  }
  #settings-panel.show .settings-sheet { transform: translateY(0); }
  .settings-title { font-weight: 800; font-size: 1rem; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; }
  .settings-close { background: none; border: none; color: var(--text-dim); font-size: 1.1rem; cursor: pointer; padding: 4px; }
  .settings-label { font-family: var(--mono); font-size: 0.68rem; color: var(--text-dim); margin-bottom: 5px; display: block; letter-spacing: 0.05em; text-transform: uppercase; }
  .settings-textarea {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; padding: 10px 12px;
    font-family: var(--mono); font-size: 0.75rem; line-height: 1.5;
    resize: vertical; min-height: 72px; outline: none; margin-bottom: 14px;
  }
  .settings-textarea:focus { border-color: var(--accent); }
  .settings-row { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
  .settings-input {
    flex: 1; background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; padding: 8px 12px;
    font-family: var(--mono); font-size: 0.75rem; outline: none;
  }
  .settings-input:focus { border-color: var(--accent); }
  .settings-save {
    width: 100%; padding: 11px; background: var(--accent); color: #fff; border: none;
    border-radius: 9px; font-family: var(--mono); font-size: 0.75rem; font-weight: 700;
    letter-spacing: 0.05em; text-transform: uppercase; cursor: pointer;
  }
  .settings-save:active { background: #6d28d9; }

  /* === TOAST === */
  #toast {
    position: fixed; bottom: calc(90px + var(--safe-bottom)); left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); font-family: var(--mono); font-size: 0.72rem;
    padding: 8px 16px; border-radius: 20px; z-index: 400;
    opacity: 0; transition: opacity 0.2s, transform 0.2s;
    pointer-events: none; white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* === MAIN === */
  #main { height: 100%; display: flex; flex-direction: column; }
  @media(min-width: 900px) {
    #sidebar { transform: translateX(0); }
    #main { margin-left: var(--sidebar-w); }
    #btn-sidebar-toggle { display: none !important; }
    #overlay { display: none !important; }
  }

  /* === HEADER === */
  #header {
    height: var(--header-h); padding: 0 12px; border-bottom: 1px solid var(--border);
    background: var(--surface); display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    position: relative; z-index: 10;
  }
  .icon-btn {
    background: none; border: 1px solid var(--border); color: var(--text); padding: 6px 8px;
    border-radius: 7px; cursor: pointer; font-size: 1rem; display: flex; align-items: center;
    transition: background var(--transition); flex-shrink: 0;
  }
  .icon-btn:active { background: var(--surface2); }
  #model-select-wrap { flex: 1; min-width: 0; }
  #model-select {
    width: 100%; padding: 7px 10px; background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; font-family: var(--mono); font-size: 0.68rem;
    cursor: pointer; appearance: none; -webkit-appearance: none; outline: none;
  }
  #model-select:focus { border-color: var(--accent); }
  #model-select option { background: var(--surface2); }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); flex-shrink: 0; transition: background 0.3s; }
  .status-dot.ready { background: var(--success); box-shadow: 0 0 8px var(--success); }
  .status-dot.loading { background: var(--accent2); animation: pulse 1s infinite; }
  .status-dot.error { background: var(--danger); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  /* === PROGRESS === */
  #progress-wrap { position: absolute; bottom: 0; left: 0; right: 0; height: 2px; overflow: hidden; }
  #progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width 0.3s; }

  /* === BODY === */
  #body { flex: 1; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }

  /* === LOG === */
  #log-wrap { border-bottom: 1px solid var(--border); background: var(--bg); flex-shrink: 0; overflow: hidden; max-height: 0; transition: max-height var(--transition); }
  #log-wrap.expanded { max-height: 120px; }
  #log-toggle { display: flex; align-items: center; gap: 6px; padding: 5px 14px; font-family: var(--mono); font-size: 0.62rem; color: var(--text-dim); cursor: pointer; background: none; border: none; width: 100%; border-bottom: 1px solid var(--border); }
  #log-toggle .chevron { transition: transform var(--transition); font-size: 0.55rem; margin-left: auto; }
  #log-toggle.open .chevron { transform: rotate(180deg); }
  #log { height: 95px; overflow-y: auto; padding: 6px 14px; display: flex; flex-direction: column; gap: 1px; }
  .log-line { font-family: var(--mono); font-size: 0.6rem; color: var(--text-dim); line-height: 1.5; }
  .log-line.info { color: var(--accent2); }
  .log-line.success { color: var(--success); }
  .log-line.warn { color: var(--warn); }
  .log-line.error { color: var(--danger); }

  /* === MESSAGES === */
  #messages { flex: 1; overflow-y: auto; padding: 16px 12px; display: flex; flex-direction: column; gap: 14px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .msg { display: flex; gap: 8px; max-width: 820px; animation: fadeUp 0.2s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user { flex-direction: row-reverse; align-self: flex-end; }
  .msg.assistant { align-self: flex-start; }
  .avatar { width: 28px; height: 28px; border-radius: 7px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 700; }
  .msg.user .avatar { background: var(--accent); color: #fff; }
  .msg.assistant .avatar { background: var(--surface2); border: 1px solid var(--border); color: var(--accent2); font-family: var(--mono); }

  .bubble-wrap { display: flex; flex-direction: column; gap: 3px; max-width: min(480px, 74vw); }
  .msg.user .bubble-wrap { align-items: flex-end; }
  .bubble {
    padding: 11px 14px; border-radius: 12px; font-size: 0.87rem; line-height: 1.65;
    word-break: break-word; white-space: pre-wrap;
  }
  .msg.user .bubble { background: var(--user-bubble); border: 1px solid rgba(124,58,237,0.3); border-top-right-radius: 3px; }
  .msg.assistant .bubble { background: var(--ai-bubble); border: 1px solid var(--border); border-top-left-radius: 3px; }
  .bubble code { font-family: var(--mono); font-size: 0.76rem; background: rgba(255,255,255,0.07); padding: 2px 5px; border-radius: 4px; }

  /* Bubble actions (shown on tap) */
  .bubble-actions {
    display: flex; gap: 4px; opacity: 0; transition: opacity 0.15s;
    pointer-events: none;
  }
  .bubble-actions.visible { opacity: 1; pointer-events: all; }
  .bub-btn {
    padding: 3px 8px; background: var(--surface2); border: 1px solid var(--border);
    color: var(--text-dim); border-radius: 5px; font-family: var(--mono); font-size: 0.58rem;
    cursor: pointer; transition: color var(--transition);
  }
  .bub-btn:active { color: var(--text); background: var(--border); }

  .cursor { display: inline-block; width: 2px; height: 1em; background: var(--accent2); margin-left: 2px; animation: blink 0.7s infinite; vertical-align: middle; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

  #empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--text-dim); padding: 20px; }
  #empty-state h2 { font-family: var(--sans); font-weight: 800; font-size: 1.7rem; color: var(--text); letter-spacing: -0.03em; }
  #empty-state p { font-family: var(--mono); font-size: 0.7rem; text-align: center; max-width: 280px; }
  .hint-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 10px; }
  .chip { padding: 7px 13px; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; font-family: var(--mono); font-size: 0.66rem; cursor: pointer; transition: border-color var(--transition), background var(--transition); }
  .chip:active { border-color: var(--accent); background: rgba(124,58,237,0.15); }

  /* === INPUT === */
  #input-area {
    padding: 10px 12px; border-top: 1px solid var(--border); background: var(--surface); flex-shrink: 0;
    padding-bottom: calc(10px + var(--safe-bottom));
  }
  #input-row {
    display: flex; gap: 8px; align-items: flex-end; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 12px; padding: 8px 10px;
    transition: border-color var(--transition);
  }
  #input-row:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  #user-input {
    flex: 1; background: none; border: none; outline: none; resize: none; overflow: hidden;
    color: var(--text); font-family: var(--sans); font-size: 0.9rem; line-height: 1.5;
    min-height: 24px; max-height: 140px; overflow-y: auto;
    /* Prevent iOS zoom on focus */
    font-size: max(0.9rem, 16px);
  }
  #user-input::placeholder { color: var(--text-dim); }
  #btn-send {
    width: 36px; height: 36px; background: var(--accent); border: none; border-radius: 8px;
    cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: background var(--transition); color: #fff; font-size: 1rem;
  }
  #btn-send:active:not(:disabled) { background: #6d28d9; }
  #btn-send:disabled { background: var(--surface); color: var(--text-dim); cursor: not-allowed; }
  #input-hint { font-family: var(--mono); font-size: 0.57rem; color: var(--text-dim); margin-top: 5px; text-align: right; }

  * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
</style>
</head>
<body>

<!-- Sidebar -->
<div id="sidebar">
  <div class="sidebar-header">
    <div class="logo">Local<span>Mind</span></div>
  </div>
  <button id="btn-new-chat">＋ New Chat</button>
  <div id="chat-list"></div>
  <div class="sidebar-footer">
    <div class="sidebar-actions">
      <button class="sidebar-btn" id="btn-settings">⚙ Settings</button>
      <button class="sidebar-btn" id="btn-share">↑ Share</button>
      <button class="sidebar-btn" id="btn-export">↓ Export</button>
    </div>
    All inference runs on-device · Zero cloud
  </div>
</div>
<div id="overlay"></div>

<!-- Custom confirm modal (replaces window.confirm which crashes WebView) -->
<div id="modal">
  <div class="modal-box">
    <div class="modal-title" id="modal-title">Confirm</div>
    <div class="modal-msg" id="modal-msg"></div>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>

<!-- Settings panel -->
<div id="settings-panel">
  <div class="settings-sheet">
    <div class="settings-title">
      Settings
      <button class="settings-close" id="btn-settings-close">✕</button>
    </div>
    <label class="settings-label">System Prompt</label>
    <textarea class="settings-textarea" id="system-prompt-input" placeholder="You are a helpful AI assistant…" rows="3"></textarea>
    <label class="settings-label">Max Output Tokens</label>
    <div class="settings-row">
      <input class="settings-input" id="max-tokens-input" type="number" min="64" max="1024" value="256"/>
    </div>
    <button class="settings-save" id="btn-save-settings">Save Settings</button>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Main -->
<div id="main">
  <div id="header">
    <button class="icon-btn" id="btn-sidebar-toggle" style="display:flex">☰</button>
    <div id="model-select-wrap">
      <select id="model-select">
        <option value="onnx-community/SmolLM2-135M-Instruct-ONNX" selected>SmolLM2 135M — Fastest</option>
        <option value="onnx-community/SmolLM2-360M-Instruct-ONNX">SmolLM2 360M — Balanced</option>
        <option value="onnx-community/Qwen2.5-0.5B-Instruct-ONNX">Qwen2.5 0.5B — Smarter</option>
        <option value="onnx-community/Llama-3.2-1B-Instruct-q4f16">Llama 3.2 1B — Best</option>
      </select>
    </div>
    <div class="status-dot" id="status-dot"></div>
    <div id="progress-wrap"><div id="progress-bar"></div></div>
  </div>

  <div id="body">
    <button id="log-toggle"><span>⚙ ENGINE LOG</span><span class="chevron">▲</span></button>
    <div id="log-wrap"><div id="log"></div></div>

    <div id="messages">
      <div id="empty-state">
        <div style="font-size:2.2rem">🧠</div>
        <h2>LocalMind</h2>
        <p>On-device AI · fully private · zero cloud · WebGPU + WASM</p>
        <div class="hint-chips">
          <div class="chip" data-prompt="Explain how neural networks learn">Neural net basics</div>
          <div class="chip" data-prompt="Write a haiku about the ocean">Write a haiku</div>
          <div class="chip" data-prompt="What is the difference between RAM and storage?">RAM vs Storage</div>
          <div class="chip" data-prompt="Give me 3 tips for better sleep">Sleep tips</div>
          <div class="chip" data-prompt="Explain quantum computing simply">Quantum computing</div>
          <div class="chip" data-prompt="Write a motivational quote">Motivate me</div>
        </div>
      </div>
    </div>

    <div id="input-area">
      <div id="input-row">
        <textarea id="user-input" rows="1" placeholder="Send a message…"></textarea>
        <button id="btn-send" disabled>▶</button>
      </div>
      <div id="input-hint">Tap ▶ to send</div>
    </div>
  </div>
</div>

<script>
// ── Storage: localStorage-first (works in all Android WebViews without CDN) ───
const CHATS_KEY = 'localmind_chats_v2';
const SETTINGS_KEY = 'localmind_settings';

function saveChats(chats) {
  try { localStorage.setItem(CHATS_KEY, JSON.stringify(chats)); } catch(_) {}
}
function loadChatsSync() {
  try { const s = localStorage.getItem(CHATS_KEY); return s ? JSON.parse(s) : {}; } catch(_) { return {}; }
}
function saveSettings(s) {
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); } catch(_) {}
}
function loadSettings() {
  try { const s = localStorage.getItem(SETTINGS_KEY); return s ? JSON.parse(s) : {}; } catch(_) { return {}; }
}

// ── Custom modal (replaces window.confirm — CRASHES Android WebView) ──────────
function showModal(title, msg, buttons) {
  return new Promise(resolve => {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-msg').textContent = msg;
    const acts = document.getElementById('modal-actions');
    acts.innerHTML = '';
    buttons.forEach(({label, cls, value}) => {
      const b = document.createElement('button');
      b.className = 'modal-btn ' + (cls||'');
      b.textContent = label;
      b.onclick = () => { document.getElementById('modal').classList.remove('show'); resolve(value); };
      acts.appendChild(b);
    });
    document.getElementById('modal').classList.add('show');
  });
}
function showConfirm(title, msg) {
  return showModal(title, msg, [
    {label:'Cancel', cls:'cancel', value:false},
    {label:'OK', cls:'ok', value:true}
  ]);
}
function showAlert(title, msg) {
  return showModal(title, msg, [{label:'OK', cls:'ok', value:true}]);
}

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastTimer = null;
function showToast(msg, duration=2000) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), duration);
}

// ── Haptic (Android vibrate API) ──────────────────────────────────────────────
function vibrate(pattern=[10]) {
  try { navigator.vibrate && navigator.vibrate(pattern); } catch(_) {}
}
</script>

<script type="module">
import { pipeline, env, TextStreamer } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3';

env.allowLocalModels = false;
env.useBrowserCache  = true;   // uses IndexedDB — works in WebView

const $ = id => document.getElementById(id);

const sidebar     = $('sidebar');
const overlay     = $('overlay');
const modelSel    = $('model-select');
const statusDot   = $('status-dot');
const progBar     = $('progress-bar');
const logWrap     = $('log-wrap');
const logEl       = $('log');
const logToggle   = $('log-toggle');
const messages    = $('messages');
const emptyState  = $('empty-state');
const userInput   = $('user-input');
const btnSend     = $('btn-send');

let pipe = null, generating = false, loadingModel = false;
let chats = {}, activeChatId = null;
const MAX_CTX = 10;
let lastLogPct = -1;
let settings = {systemPrompt:'', maxTokens:256};

// ── Load settings ─────────────────────────────────────────────────────────────
(function() {
  const s = loadSettings();
  if (s.systemPrompt !== undefined) settings.systemPrompt = s.systemPrompt;
  if (s.maxTokens !== undefined) settings.maxTokens = parseInt(s.maxTokens)||256;
  $('system-prompt-input').value = settings.systemPrompt;
  $('max-tokens-input').value = settings.maxTokens;
})();

// ── Sidebar ───────────────────────────────────────────────────────────────────
function openSidebar()  { sidebar.classList.add('open'); overlay.classList.add('show'); pushBackState(); }
function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('show'); }

$('btn-sidebar-toggle').onclick = () => { sidebar.classList.contains('open') ? closeSidebar() : openSidebar(); vibrate(); };
overlay.onclick = () => { closeSidebar(); vibrate(); };

// ── Android back button via popstate ─────────────────────────────────────────
function pushBackState() { history.pushState({lm:true}, ''); }
window.addEventListener('popstate', () => {
  if ($('settings-panel').classList.contains('show')) { closeSettings(); pushBackState(); return; }
  if ($('modal').classList.contains('show')) return; // let modal handle its own close
  if (sidebar.classList.contains('open')) { closeSidebar(); pushBackState(); }
});

// ── Touch swipe to open/close sidebar ────────────────────────────────────────
let swipeStartX = 0, swipeStartY = 0;
document.addEventListener('touchstart', e => {
  swipeStartX = e.touches[0].clientX;
  swipeStartY = e.touches[0].clientY;
}, {passive:true});
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - swipeStartX;
  const dy = Math.abs(e.changedTouches[0].clientY - swipeStartY);
  if (dy > 60) return; // vertical scroll, ignore
  if (dx > 55 && swipeStartX < 35 && !sidebar.classList.contains('open')) { openSidebar(); vibrate(); }
  if (dx < -55 && sidebar.classList.contains('open')) { closeSidebar(); vibrate(); }
}, {passive:true});

// ── Visual viewport fix (Android keyboard resize) ─────────────────────────────
if (window.visualViewport) {
  const fix = () => {
    document.getElementById('main').style.height = window.visualViewport.height + 'px';
  };
  window.visualViewport.addEventListener('resize', fix);
  window.visualViewport.addEventListener('scroll', fix);
  fix();
}

// ── Log ───────────────────────────────────────────────────────────────────────
logToggle.onclick = () => {
  const o = logWrap.classList.toggle('expanded');
  logToggle.classList.toggle('open', o);
};
function addLog(msg, type='') {
  const d = document.createElement('div');
  d.className = 'log-line' + (type ? ' '+type : '');
  d.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  logEl.appendChild(d);
  while (logEl.children.length > 100) logEl.removeChild(logEl.firstChild);
  logEl.scrollTop = logEl.scrollHeight;
  if (type==='warn'||type==='error') { logWrap.classList.add('expanded'); logToggle.classList.add('open'); }
}

// ── Progress ──────────────────────────────────────────────────────────────────
function onProgress(e) {
  if (e.status==='initiate') { addLog(`⬇ ${e.file}…`,'info'); }
  else if (e.status==='progress' && e.total) {
    const pct = Math.round((e.loaded/e.total)*100);
    progBar.style.width = pct+'%';
    if (pct !== lastLogPct && pct%20===0) { addLog(`↓ ${e.file} ${pct}%`); lastLogPct=pct; }
  } else if (e.status==='done') { addLog(`✓ ${e.file||'file'}`,'success'); }
}

// ── Model load ────────────────────────────────────────────────────────────────
async function loadModel(modelId) {
  if (loadingModel) return;
  loadingModel = true;
  setStatus('loading'); btnSend.disabled = true; lastLogPct = -1; progBar.style.width='0%';
  addLog(`Loading: ${modelId}`,'info');

  if (pipe) {
    try { await pipe.dispose(); } catch(_) {}
    pipe = null;
    addLog('Previous pipeline released');
  }

  // Check WebGPU availability — don't try if absent (saves crash on Android)
  const hasWebGPU = !!navigator.gpu;
  const devicePlan = hasWebGPU
    ? [['webgpu','q4'], ['wasm', null]]
    : [['wasm', null]];
  if (!hasWebGPU) addLog('WebGPU unavailable — using WASM','info');

  const opts = { progress_callback: onProgress };

  for (const [device, dtype] of devicePlan) {
    try {
      pipe = await pipeline('text-generation', modelId,
        dtype ? {...opts, device, dtype} : {...opts, device});
      progBar.style.width='100%';
      setTimeout(()=>progBar.style.width='0%', 600);
      setStatus('ready');
      addLog(`Ready (${device}): ${modelId}`,'success');
      if (!generating) btnSend.disabled = false;
      vibrate([10, 50, 10]);
      break;
    } catch(err) {
      addLog(`${device} failed: ${err.message}`,'warn');
      pipe = null;
      if (device==='wasm') {
        setStatus('error');
        addLog('Could not load model — try a smaller one','error');
        await showAlert('Load Failed', `Could not load "${modelId}". Try a smaller model.`);
      }
    }
  }
  loadingModel = false;
}

function setStatus(s) { statusDot.className='status-dot'+(s?' '+s:''); }

modelSel.onchange = async () => {
  const label = modelSel.options[modelSel.selectedIndex].text;
  const ok = await showConfirm('Load Model', `Load "${label}"?\n\nThis downloads model weights. Use Wi-Fi to avoid data charges.`);
  if (!ok) {
    // Cannot revert to old value without knowing it — just reload the first model option
    return;
  }
  loadModel(modelSel.value);
};

// ── Chat management ───────────────────────────────────────────────────────────
function newChat() {
  const id = 'chat_'+Date.now();
  chats[id] = {id, title:'New Chat', messages:[]};
  activeChatId = id; saveChats(chats); renderChatList(); renderMessages();
  closeSidebar();
}
async function deleteChat(id) {
  const ok = await showConfirm('Delete Chat', 'Delete this chat? This cannot be undone.');
  if (!ok) return;
  delete chats[id];
  if (activeChatId===id) { const ids=Object.keys(chats); activeChatId=ids.length?ids[ids.length-1]:null; }
  saveChats(chats); renderChatList(); renderMessages();
}
function switchChat(id) {
  activeChatId=id; renderChatList(); renderMessages();
  closeSidebar();
}
function escHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderChatList() {
  $('chat-list').innerHTML='';
  Object.keys(chats).reverse().forEach(id => {
    const el=document.createElement('div');
    el.className='chat-item'+(id===activeChatId?' active':'');
    el.innerHTML=`<span class="chat-item-title">💬 ${escHtml(chats[id].title)}</span><button class="chat-del" title="Delete">✕</button>`;
    el.onclick = e => { if(!e.target.classList.contains('chat-del')) switchChat(id); };
    el.querySelector('.chat-del').onclick = e => { e.stopPropagation(); deleteChat(id); };
    $('chat-list').appendChild(el);
  });
}

function renderMessages() {
  messages.innerHTML='';
  const chat=activeChatId&&chats[activeChatId];
  if (!chat||!chat.messages.length) { messages.appendChild(emptyState); return; }
  chat.messages.forEach(m=>appendBubble(m.role,m.content));
  messages.scrollTop=messages.scrollHeight;
}

// Track currently open bubble actions
let openBubbleActions = null;
function closeOpenActions() { if (openBubbleActions) { openBubbleActions.classList.remove('visible'); openBubbleActions=null; } }
document.addEventListener('touchstart', () => closeOpenActions(), {passive:true});

function appendBubble(role, content, streaming=false) {
  const wrap = document.createElement('div'); wrap.className=`msg ${role}`;
  const av = document.createElement('div'); av.className='avatar';
  av.textContent = role==='user'?'U':'AI';
  const bw = document.createElement('div'); bw.className='bubble-wrap';
  const bub = document.createElement('div'); bub.className='bubble';
  const tn = document.createTextNode(content); bub.appendChild(tn);
  if (streaming) { const c=document.createElement('span'); c.className='cursor'; bub.appendChild(c); }

  // Bubble action bar (copy / share)
  const acts = document.createElement('div'); acts.className='bubble-actions';
  const copyBtn = document.createElement('button'); copyBtn.className='bub-btn'; copyBtn.textContent='Copy';
  copyBtn.onclick = e => {
    e.stopPropagation();
    copyText(tn.nodeValue||content);
  };
  acts.appendChild(copyBtn);
  if (role==='assistant') {
    const shareBtn = document.createElement('button'); shareBtn.className='bub-btn'; shareBtn.textContent='Share';
    shareBtn.onclick = e => { e.stopPropagation(); shareText(tn.nodeValue||content); };
    acts.appendChild(shareBtn);
  }

  bub.addEventListener('click', e => {
    e.stopPropagation();
    if (openBubbleActions && openBubbleActions!==acts) closeOpenActions();
    acts.classList.toggle('visible');
    openBubbleActions = acts.classList.contains('visible') ? acts : null;
    if (acts.classList.contains('visible')) vibrate(8);
  });

  bw.appendChild(bub); bw.appendChild(acts);
  wrap.appendChild(av); wrap.appendChild(bw);
  messages.appendChild(wrap); messages.scrollTop=messages.scrollHeight;
  return {bub, tn};
}

// ── Copy / Share helpers ──────────────────────────────────────────────────────
function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showToast('Copied!')).catch(() => fallbackCopy(text));
  } else { fallbackCopy(text); }
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea'); ta.value=text;
  ta.style.cssText='position:fixed;opacity:0;pointer-events:none';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand('copy'); showToast('Copied!'); } catch(_) { showToast('Copy failed'); }
  document.body.removeChild(ta);
}
function shareText(text) {
  if (navigator.share) {
    navigator.share({title:'LocalMind', text}).catch(()=>{});
  } else { copyText(text); }
}

function exportChat() {
  const chat = activeChatId && chats[activeChatId];
  if (!chat || !chat.messages.length) { showToast('No messages to export'); return; }
  const lines = chat.messages.map(m=>`[${m.role.toUpperCase()}]\n${m.content}`).join('\n\n---\n\n');
  const blob = new Blob([lines], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=`${chat.title}.txt`; a.click();
  URL.revokeObjectURL(url);
  showToast('Exported!');
}
function shareChat() {
  const chat = activeChatId && chats[activeChatId];
  if (!chat || !chat.messages.length) { showToast('No messages to share'); return; }
  const lines = chat.messages.map(m=>`${m.role==='user'?'You':'AI'}: ${m.content}`).join('\n\n');
  shareText(lines);
}

// ── Settings panel ────────────────────────────────────────────────────────────
function openSettings() { $('settings-panel').classList.add('show'); closeSidebar(); pushBackState(); }
function closeSettings() { $('settings-panel').classList.remove('show'); }
$('btn-settings').onclick = openSettings;
$('btn-settings-close').onclick = closeSettings;
$('settings-panel').onclick = e => { if (e.target===$('settings-panel')) closeSettings(); };
$('btn-save-settings').onclick = () => {
  settings.systemPrompt = $('system-prompt-input').value.trim();
  settings.maxTokens = parseInt($('max-tokens-input').value)||256;
  saveSettings(settings);
  closeSettings();
  showToast('Settings saved');
};

// ── Sidebar buttons ───────────────────────────────────────────────────────────
$('btn-share').onclick = shareChat;
$('btn-export').onclick = exportChat;

// ── Generation ────────────────────────────────────────────────────────────────
async function generate(prompt) {
  if (!pipe||generating) return;
  const chat=chats[activeChatId]; if(!chat) return;

  generating=true; btnSend.disabled=true; emptyState.remove();
  chat.messages.push({role:'user',content:prompt});
  if (chat.title==='New Chat') chat.title=prompt.slice(0,36)+(prompt.length>36?'…':'');
  appendBubble('user',prompt); renderChatList();

  // Build context; prepend system prompt if set
  let ctx = chat.messages.length > MAX_CTX
    ? chat.messages.slice(-MAX_CTX)
    : [...chat.messages];
  if (settings.systemPrompt) {
    ctx = [{role:'system', content:settings.systemPrompt}, ...ctx.filter(m=>m.role!=='system')];
  }

  const {bub, tn} = appendBubble('assistant','',true);
  let out='', toks=0;
  const t0=performance.now();
  addLog('Generating…','info');

  let rafId=null;
  const flush=()=>{ tn.nodeValue=out; rafId=null; messages.scrollTop=messages.scrollHeight; };

  try {
    const streamer=new TextStreamer(pipe.tokenizer,{
      skip_prompt:true, skip_special_tokens:true,
      callback_function: text => {
        toks++; out+=text;
        if (!rafId) rafId=requestAnimationFrame(flush);
      }
    });
    const result=await pipe(ctx,{
      max_new_tokens: settings.maxTokens || 256,
      do_sample: false,
      repetition_penalty: 1.15,
      streamer
    });
    if (rafId) { cancelAnimationFrame(rafId); flush(); }
    if (!out) {
      const raw=result?.[0]?.generated_text;
      if (Array.isArray(raw)) out=raw.at(-1)?.content??'';
      else if (typeof raw==='string') {
        const p=raw.split(/(<\|assistant\|>|assistant\n)/i);
        out=(p.length>1?p.pop():raw).trim();
      }
    }
  } catch(err) {
    addLog(`Error: ${err.message}`,'error');
    out=out||'[Generation failed — try a smaller model or reload the app]';
  }

  const cursor=bub.querySelector('.cursor'); if(cursor) cursor.remove();
  tn.nodeValue=out.trim();

  const secs=((performance.now()-t0)/1000).toFixed(2);
  addLog(`✓ ${toks} tokens · ${(toks/+secs).toFixed(1)} tok/s · ${secs}s`,'success');
  vibrate([5,30,5]);

  chat.messages.push({role:'assistant',content:out.trim()});
  saveChats(chats);
  generating=false; if(pipe) btnSend.disabled=false;
  messages.scrollTop=messages.scrollHeight;
}

// ── Input ─────────────────────────────────────────────────────────────────────
userInput.addEventListener('input',()=>{
  userInput.style.height='auto';
  userInput.style.height=Math.min(userInput.scrollHeight,140)+'px';
});
// Android: don't intercept Enter (users need it for new lines on mobile keyboard)
// Keep desktop Enter behavior only
userInput.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&!('ontouchstart' in window)){
    e.preventDefault(); handleSend();
  }
});
btnSend.onclick=()=>{ vibrate(12); handleSend(); };

function handleSend() {
  const text=userInput.value.trim();
  if (!text||!pipe||generating) {
    if (!pipe&&!loadingModel) {
      addLog('Select a model from the dropdown to load it first','warn');
      logWrap.classList.add('expanded'); logToggle.classList.add('open');
    }
    return;
  }
  if (!activeChatId) newChat();
  userInput.value=''; userInput.style.height='auto';
  generate(text);
}

document.querySelectorAll('.chip').forEach(c=>{
  c.onclick=()=>{
    if(!pipe){
      addLog('Load a model first — tap the model dropdown','warn');
      logWrap.classList.add('expanded'); logToggle.classList.add('open');
      return;
    }
    if(!activeChatId) newChat();
    userInput.value=c.dataset.prompt; handleSend();
  };
});

$('btn-new-chat').onclick=newChat;

// ── Init ──────────────────────────────────────────────────────────────────────
function init() {
  chats = loadChatsSync();
  const ids = Object.keys(chats);
  if (ids.length) { activeChatId=ids[ids.length-1]; renderChatList(); renderMessages(); }
  else { newChat(); }
  addLog('Ready — select a model to begin','info');
  logWrap.classList.add('expanded'); logToggle.classList.add('open');
}

init();
</script>
</body>
