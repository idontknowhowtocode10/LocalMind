workflows:
  android-build:
    name: Native Android APK Build
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      groups:
        - None
      # The SDK and NDK versions must be nested under vars or defaults depending on configuration
    scripts:
      - name: Install Node Modules
        script: npm install
      - name: Generate Android Project Shell
        script: npx react-native@latest init LocalMind --directory android --skip-install
      - name: Compile Android Debug APK
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
