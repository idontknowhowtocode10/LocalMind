workflows:
  android-build:
    name: Native Android APK Build
    max_build_duration: 30
    environment:
      groups:
        - None
    scripts:
      - name: Install Node Modules
        script: npm install
      - name: Generate Android Project Shell
        script: npx @react-native-community/cli init LocalMind --directory android --skip-install
      - name: Compile Android Debug APK
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
