workflows:
  android-build:
    name: Native Android APK Build with Live Sync
    max_build_duration: 30
    environment:
      groups:
        - None
    scripts:
      - name: Initialize Web-to-APK Workspace
        script: |
          npm install -g cordova
          cordova create localmind_app com.localmind.ai LocalMind
          cd localmind_app
          cordova platform add android --save
      - name: Inject Live Sync Code Gateway
        script: |
          cd localmind_app
          rm -rf www/*
          
          # REPLACE 'YOUR_GITHUB_USERNAME' AND 'YOUR_REPO_NAME' WITH YOUR ACTUAL GITHUB DETAILS BELOW:
          EXT_URL="https://idontknowhowtocode10.github.io/LocalMind/"
          
          # Creates a robust native browser gateway container
          cat <<EOF > www/index.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8">
              <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
              <title>LocalMind Launcher</title>
              <style>
                  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #0a0a0f; }
                  iframe { border: none; width: 100%; height: 100%; }
              </style>
          </head>
          <body>
              <iframe src="${EXT_URL}"></iframe>
          </body>
          </html>
          EOF
      - name: Compile Android Debug APK
        script: |
          cd localmind_app
          cordova build android --debug --device
    artifacts:
      - localmind_app/platforms/android/app/build/outputs/apk/debug/*.apk
