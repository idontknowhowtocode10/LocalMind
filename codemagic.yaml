workflows:
  android-build:
    name: Native Android APK Build
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      android_ndk: 25.2.9519653
      android_sdk: 33
    scripts:
      - name: Install Node Modules
        script: npm install
      - name: Generate Android Project Shell
        script: npx react-native@latest init LocalMind --directory android --skip-install
      - name: Compile Android Debug APK
        script: |
          cd android/android
          ./gradlew assembleDebug
    artifacts:
      - android/android/app/build/outputs/apk/debug/*.apk
