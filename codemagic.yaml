workflows:
  android-build:
    name: Native Android APK Build
    max_build_duration: 30
    # No instance_type declared = Codemagic defaults to the free standard machine
    environment:
      groups:
        - None
    scripts:
      - name: Install Node Modules
        script: npm install
      - name: Generate Android Project Shell
        script: npx react-native@latest init LocalMind --directory android --skip-install
      - name: Compile Android Debug APK
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
