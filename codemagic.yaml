workflows:
  android-build:
    name: Native Android APK Build
    max_build_duration: 30
    environment:
      groups:
        - None
    scripts:
      - name: Install Node Modules
        script: npm install
      - name: Generate Android Project Shell
        script: npx @react-native-community/cli@latest init LocalMind --skip-install
      - name: Compile Android Debug APK
        script: |
          cd LocalMind/android
          ./gradlew assembleDebug
    artifacts:
      - LocalMind/android/app/build/outputs/apk/debug/*.apk
